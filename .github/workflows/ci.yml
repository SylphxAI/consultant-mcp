name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  risk-classification:
    name: risk-classification/pass
    runs-on: ubuntu-latest  # summary gate: GitHub-hosted so a runner-fleet fault never blocks a merge
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: ADR-29 risk classification
        uses: SylphxAI/.github/.github/actions/adr29-admission@main
        with:
          mode: classify
          policy-mode: observe

  ci:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        # Frozen bun.lock is install authority. Missing platform
        # optionalDependencies remain optional and must not restore npm as the
        # company TypeScript toolchain.
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build and stage Rust MCP server for npm packaging
        run: bun run build:rust

      - name: Verify package
        run: bun run verify

      - name: TS stdio adapter deletion gate (transport/stdio-ts-adapter ts_deleted)
        run: bun run check:ts-adapter-deleted

      - name: Rust clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test project-control boundary
        run: bun run test:project-control

      - name: GroundAtlas package dogfood
        id: groundatlas
        # Run the released GroundAtlas package through Bun instead of the
        # composite action. The composite action shells out to `node` and
        # `npm exec`, which this Bun-only job does not install, so it failed
        # with `node: command not found` (exit 127). `--package groundatlas@0.1.3 ga`
        # selects the `ga` bin without needing npm.
        run: |
          set -euo pipefail
          bun x --bun --package groundatlas@0.1.3 ga update --out .groundatlas-pilot
          bun x --bun --package groundatlas@0.1.3 ga manifest --out .groundatlas-pilot --json | tee "$RUNNER_TEMP/groundatlas-manifest.json"
          bun x --bun --package groundatlas@0.1.3 ga audit --out .groundatlas-pilot
          bun x --bun --package groundatlas@0.1.3 ga fleet . --out .groundatlas-pilot --require-atlas --strict --json | tee "$RUNNER_TEMP/groundatlas-fleet.json"
          bun x --bun --package groundatlas@0.1.3 ga fleet . --out .groundatlas-pilot --require-atlas --strict | tee "$RUNNER_TEMP/groundatlas-fleet.md"

      - name: Assert GroundAtlas truth boundary
        run: |
          bun - "$RUNNER_TEMP/groundatlas-manifest.json" "$RUNNER_TEMP/groundatlas-fleet.json" "$RUNNER_TEMP/groundatlas-fleet.md" <<'BUN'
          const [manifestPath, fleetPath, fleetMarkdownPath] = process.argv.slice(2);
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const fleet = JSON.parse(readFileSync(fleetPath, "utf8"));
          const fleetMarkdown = readFileSync(fleetMarkdownPath, "utf8");
          const project = fleet.projects?.[0];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          assert(manifest.selected?.path === "project.manifest.json", "GroundAtlas must select the vendor-neutral project.manifest.json file.");
          assert(manifest.selected?.adapter === false, "Selected GroundAtlas manifest must not be a vendor adapter.");
          assert(manifest.selected?.projectId === "consultant-mcp", "GroundAtlas selected the wrong project id.");
          assert(project?.status === "adopted", "Fleet report must mark consultant-mcp adopted.");
          assert(project?.generatedAtlas?.ok === true, "Generated GroundAtlas evidence must match the current scan.");
          assert(project?.manifest?.path === "project.manifest.json", "Fleet report must use project.manifest.json as the manifest.");
          assert(project?.manifestAdapters?.some((adapter) => adapter.path === ".doctrine/project.json" && adapter.adapter === true), "Fleet report must keep .doctrine/project.json as an adapter.");
          assert(fleetMarkdown.includes("# GroundAtlas fleet adoption report"), "Markdown fleet scorecard must include the report title.");
          assert(fleetMarkdown.includes("Summary: 1 adopted, 0 warning, 0 blocked, 1 total."), "Markdown fleet scorecard must include the adopted summary.");
          BUN

      - name: Upload GroundAtlas reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groundatlas-package-dogfood
          path: |
            ${{ runner.temp }}/groundatlas-manifest.json
            ${{ runner.temp }}/groundatlas-fleet.json
            ${{ runner.temp }}/groundatlas-fleet.md

  trunk-admission:
    name: trunk-admission/pass
    runs-on: ubuntu-latest  # summary gate: GitHub-hosted so a runner-fleet fault never blocks a merge
    needs:
      - risk-classification
      - ci
    if: ${{ !cancelled() }}
    steps:
      - name: ADR-29 trunk admission
        uses: SylphxAI/.github/.github/actions/adr29-admission@main
        with:
          mode: fan-in
          policy-mode: observe
          upstream-results-json: ${{ toJSON(needs) }}

  postsubmit-proof:
    name: postsubmit-proof/pass
    runs-on: ubuntu-latest  # summary gate: GitHub-hosted so a runner-fleet fault never blocks a merge
    needs:
      - risk-classification
      - ci
      - trunk-admission
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
    steps:
      - name: ADR-29 postsubmit proof
        uses: SylphxAI/.github/.github/actions/adr29-admission@main
        with:
          mode: postsubmit-proof
          policy-mode: enforce
          upstream-results-json: ${{ toJSON(needs) }}

  recovery-decision:
    name: recovery-decision/pass
    runs-on: ubuntu-latest  # summary gate: GitHub-hosted so a runner-fleet fault never blocks a merge
    needs:
      - risk-classification
      - ci
      - trunk-admission
      - postsubmit-proof
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.postsubmit-proof.result != 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: ADR-29 recovery decision
        uses: SylphxAI/.github/.github/actions/adr29-admission@main
        with:
          mode: recovery-decision
          policy-mode: observe
          upstream-results-json: ${{ toJSON(needs) }}
